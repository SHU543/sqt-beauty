<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sqt.beauty</title>
<meta name="description" content="sqt.beauty · 个人创意工作室，网站建设中。">
<meta property="og:title" content="sqt.beauty">
<meta property="og:description" content="个人创意工作室，网站建设中。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wdth,wght@75..150,300..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e2e2e2;
    --surface: #d6d6d6;
    --ink: #7d0c14;
    --muted: #7a4a4e;
    --accent: #7d0c14;
    --accent-ink: #e2e2e2;
    --field: #7d0c14;
    --step-small: clamp(0.8125rem, 0.79rem + 0.1vw, 0.875rem);
    --step-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
    --step-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
    --margin: clamp(20px, 3vw, 32px);
  }

  * { box-sizing: border-box; }

  html { background: var(--bg); }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "TikTok Sans", system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: var(--step-body);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  img { display: block; max-width: 100%; }

  .page { min-height: 100svh; display: flex; flex-direction: column; }

  /* ---------- hero ---------- */
  .hero {
    min-height: 100svh;
    display: grid;
    grid-template-columns: 47% 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "nav nav"
      "media side"
      "name name";
    gap: var(--margin);
    padding: var(--margin) var(--margin) 0;
    overflow: hidden;
  }

  .topbar {
    grid-area: nav;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: clamp(16px, 2.4vw, 34px);
    font-size: var(--step-small);
  }

  .topbar a { text-decoration: none; }
  .topbar a:hover { text-decoration: underline; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 22px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: var(--step-small);
    font-weight: 500;
    text-decoration: none;
  }

  .btn:hover { background: #5e0a0f; text-decoration: none; }
  .btn:active { transform: translateY(1px); }

  .hero-media {
    grid-area: media;
    margin: 0;
    min-height: 0;
    max-height: 66vh;
    overflow: hidden;
  }

  .hero-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(1);
  }

  .hero-side {
    grid-area: side;
    align-self: center;
  }

  .hero-lede {
    margin: 0;
    max-width: 26ch;
    font-size: var(--step-lead);
    line-height: 1.3;
  }

  .wordmark {
    grid-area: name;
    margin: 0;
    padding: 0;
    font-size: clamp(3.2rem, 13.5vw, 15rem);
    font-weight: 800;
    font-stretch: 130%;
    letter-spacing: -0.045em;
    line-height: 0.86;
    white-space: nowrap;
    transform-origin: left bottom;
    margin-top: clamp(-44px, -2.4vw, -14px);
  }

  .wordmark .dot { color: var(--accent); }

  /* ---------- intro ---------- */
  .intro {
    background: var(--surface);
    padding: clamp(100px, 14vw, 200px) var(--margin);
  }

  .intro-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: var(--margin);
    align-items: start;
  }

  .intro-text {
    grid-column: 7 / 13;
    margin: 0;
    font-size: clamp(1.375rem, 2.2vw, 2.125rem);
    line-height: 1.28;
    letter-spacing: -0.01em;
  }

  .intro-text p { margin: 0 0 0.8em; }
  .intro-text p:last-child { margin-bottom: 0; }

  .intro-figure {
    grid-column: 1 / 4;
    margin: 0;
    align-self: end;
  }

  .intro-figure img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    filter: grayscale(1);
  }

  .intro-figure figcaption {
    margin-top: 12px;
    font-size: var(--step-small);
    color: var(--muted);
  }

  /* ---------- bands ---------- */
  .band {
    margin: 0;
    padding: 0 var(--margin);
    background: var(--surface);
  }

  .band img {
    width: 100%;
    height: clamp(200px, 36vw, 480px);
    object-fit: cover;
    filter: grayscale(1);
  }

  .band + .band { padding-top: var(--margin); }

  /* ---------- footer ---------- */
  .footer {
    background: var(--field);
    color: var(--accent-ink);
    padding: clamp(80px, 11vw, 160px) var(--margin) var(--margin);
  }

  .footer-inner {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: var(--margin);
    align-items: end;
  }

  .footer-name {
    margin: 0;
    font-size: clamp(2.4rem, 9vw, 10rem);
    font-weight: 800;
    font-stretch: 130%;
    letter-spacing: -0.045em;
    line-height: 0.88;
    white-space: nowrap;
  }

  .footer-meta {
    font-size: var(--step-small);
    text-align: right;
    line-height: 1.7;
  }

  .footer-meta a { text-decoration: none; }
  .footer-meta a:hover { text-decoration: underline; }

  /* ---------- motion ---------- */
  [data-reveal] {
    opacity: 0;
    transform: translateY(22px);
    transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1);
  }

  .hero-media img,
  .intro-figure img,
  .band img {
    transition: transform 1.1s cubic-bezier(.2,.7,.2,1);
  }

  @media (max-width: 820px) {
    .hero {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto;
      grid-template-areas:
        "nav"
        "media"
        "name"
        "side";
    }
    .hero-media { max-height: 46vh; }
    .hero-side { padding-bottom: 8px; }
    .hero-lede { max-width: 30ch; }
    .wordmark { margin-top: -0.12em; }
    .intro-grid { display: block; }
    .intro-text { margin-bottom: 56px; }
    .intro-figure { width: 62%; margin-left: auto; }
    .footer-inner { display: block; }
    .footer-meta { margin-top: 40px; text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {
    [data-reveal] { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <nav class="topbar" aria-label="主导航">
      <a href="#work">作品</a>
      <a href="#about">关于</a>
      <a class="btn" href="mailto:hello@sqt.beauty">写信给我</a>
    </nav>

    <figure class="hero-media" data-reveal>
      <img src="https://picsum.photos/id/942/1200/1500" width="1200" height="1500" alt="占位图片：白色几何建筑与深色天空">
    </figure>

    <div class="hero-side">
      <p class="hero-lede" data-reveal>个人创意工作室 · 网站建设中</p>
    </div>

    <h1 class="wordmark" data-reveal>sqt<span class="dot">.</span>beauty</h1>
  </header>

  <section class="intro" id="about">
    <div class="intro-grid">
      <figure class="intro-figure" data-reveal>
        <img src="https://picsum.photos/id/620/800/1000" width="800" height="1000" alt="占位图片：浅色拱桥横跨水面">
        <figcaption>占位图片，上线前替换为你的作品。</figcaption>
      </figure>
      <div class="intro-text" data-reveal>
        <p>这里将放你的作品与介绍。这个页面目前是占位版本，用来先把域名、仓库和自动发布跑通；等你准备好内容，直接替换这个文件即可。</p>
        <p>网站基于 GitHub Pages 托管，绑定域名 sqt.beauty，推送后一两分钟自动更新。</p>
      </div>
    </div>
  </section>

  <figure class="band" data-reveal>
    <img src="https://picsum.photos/id/887/2400/1350" width="2400" height="1350" alt="占位图片：白色公寓立面与重复的阳台窗户">
  </figure>

  <figure class="band" data-reveal>
    <img src="https://picsum.photos/id/618/2400/1350" width="2400" height="1350" alt="占位图片：黑白玻璃与钢结构的弧形屋顶">
  </figure>

  <footer class="footer" id="work">
    <div class="footer-inner">
      <p class="footer-name" data-reveal>sqt.beauty</p>
      <div class="footer-meta" data-reveal>
        <div><a href="mailto:hello@sqt.beauty">hello@sqt.beauty</a></div>
        <div>© <span id="year">2026</span> sqt.beauty</div>
      </div>
    </div>
  </footer>
</div>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  document.addEventListener("DOMContentLoaded", function () {
    // 延后一拍：让页面监测脚本先就位
    setTimeout(init, 300);
  });

  function init() {
    var rare = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var els = document.querySelectorAll("[data-reveal]");

    function show(el) {
      el.style.opacity = "1";
      el.style.transform = "none";
    }

    if (rare) {
      els.forEach(show);
      return;
    }

    var heroImg = document.querySelector(".hero-media img");
    if (heroImg) {
      heroImg.style.transform = "scale(1.06)";
      requestAnimationFrame(function () { heroImg.style.transform = "scale(1)"; });
    }

    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { show(e.target); io.unobserve(e.target); }
        });
      }, { threshold: 0.1 });
      els.forEach(function (el) { io.observe(el); });
    } else {
      els.forEach(show);
    }
  }
</script>
</body>
</html>
